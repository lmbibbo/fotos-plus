name: archive-merge

# El job `verify` corre en cada PR y en cada push a un PR. El job `merge` solo
# corre si la etiqueta aplicada es exactamente `archive`.
on:
  pull_request:
    # `main` exige el check `verify`, asi que tiene que correr en cada push y en
    # cada PR nuevo, no solo cuando alguien aplica una etiqueta. Sin esto ningun
    # PR podia desbloquearse. `labeled` se conserva porque el job `merge` de mas
    # abajo sigue gatillado por la etiqueta `archive`.
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar specs y changes
        # El paquete de npm "openspec" esta vacio (0.0.0, sin bin). El
        # proyecto real es @fission-ai/openspec, que expone el binario
        # `openspec`. Usar el nombre corto falla con "could not determine
        # executable to run".
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict

  merge:
    name: merge
    needs: verify
    if: github.event.label.name == 'archive'
    runs-on: ubuntu-latest
    steps:
      - name: Merge del pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
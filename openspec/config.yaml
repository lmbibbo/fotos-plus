schema: spec-driven

context: |
  Project:
  - Photo organizer. It explores a directory of photos taken with a phone or a
    digital camera and organizes them by date, place, and people.
  - It includes an ordered viewer for the photos that are already organized.

  Tech stack:
  - App: Python, single package `fotos_plus`.
  - Tests: pytest.
  - The server and the viewer are not separate applications.
    `fotos_plus/server.py` serves over `ThreadingHTTPServer`, and
    `fotos_plus/viewer.py` emits one self-contained HTML document with inline
    CSS and JS and base64 `data:` URIs for thumbnails. There is no frontend
    build, no JS files, and no framework.

  Git workflow:
  - Each change is developed on a `feature/<change-name>` branch.
  - Direct commits or pushes to `main` are not allowed.
  - `openspec archive` runs ON that feature branch, never on `main`.
  - The archive result is committed on the same branch as the code and tests.
  - The branch is pushed and a pull request is opened against `main`.
  - Required checks use `strict: true` and force pushes are disabled. Once
    `main` moves, merge `main` into the branch and push the merge commit:
    `git merge origin/main && git push`.

  Language:
  - The user writes in Spanish; the agent ALWAYS replies in English.
  - This applies to chat, code, code comments, commit messages, pull request
    descriptions, and every generated artifact (proposal, design, specs,
    tasks).
  - Content generated earlier in Spanish is not retroactively translated.

rules:
  proposal:
    - Include rollback plan
    - Write in English
  specs:
    - Use Given/When/Then format for scenarios
    - Write normative keywords in English. Use MUST on the first verb of each
      requirement, and MUST NOT for prohibitions
  design:
    - Include sequence diagrams for complex flows
    - Write in English
  tasks:
    - Write in English

operations:
  archive:
    guidance:
      - Run the archive on the current feature branch, never on `main`.
      - Run `openspec validate --specs --strict` before committing.
      - git push -u origin <branch> and then gh pr create --base main.
      - If the branch already has an open PR, do not create another one.
      - The PR merges only when the `archive` label is applied, because that
        label is the sole trigger for the squash merge and the branch
        deletion.

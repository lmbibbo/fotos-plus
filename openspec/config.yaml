schema: spec-driven

context: |
  Proyecto:
  - Organizador de fotos.
  - Explora un directorio o carpeta con fotos tomadas con un celular o una cámara digital
    y las organiza según distintos criterios: fechas, lugares y gente.
  - Incluye un visualizador ordenado de las fotos ya organizadas.
  Tech stack:
  - App: Python
  - Pruebas: pytest.
  Git workflow:
  - Cada cambio se desarrolla en una rama `feature/<nombre-del-cambio>`.
  - `openspec archive` se ejecuta SOBRE esa rama de feature, nunca sobre `main`.
  - El resultado del archive se commitea en la misma rama, junto con el
    código y los tests.
  - La rama se pushea y se abre un PR contra `main` conteniendo todo el cambio.

rules:
  proposal:
    - Include rollback plan
  specs:
    - Use Given/When/Then format for scenarios
    - Write normative keywords in Spanish, DEBE (MUST) on the first verb of each
      requirement and NO DEBE for prohibitions, because the OpenSpec validator looks
      for MUST or SHALL
  design:
    - Include sequence diagrams for complex flows

operations:
  archive:
    guidance:
      - Ejecutar el archive sobre la rama de feature actual, nunca sobre `main`.
      - Un único commit con código, tests, specs sincronizadas y archive.
      - Correr `openspec validate --specs --strict` antes de commitear.
      - git push -u origin <rama> y luego gh pr create --base main.
      - Si la rama ya tiene un PR abierto, no crear otro.

